server {
    listen 127.0.0.1:8081 default_server;
    server_name qa.linearproduct.co;
    root /var/www/ingenium-qa/current;
    index index.html;
    server_tokens off;
    client_max_body_size 53m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Ingenium-Environment qa always;
    add_header Cache-Control no-store always;

    location = /healthz {
        default_type text/plain;
        return 200 "qa ok\n";
    }
    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://127.0.0.1:8018/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
