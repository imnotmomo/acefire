name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel production while its deployment may be activating.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Application checks
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Publish home server
    needs: checks
    if: vars.HOME_CD_ENABLED == 'true' && github.repository == 'imnotmomo/acefire' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
    permissions:
      contents: read
      actions: read
    secrets:
      ACEFIRE_DEPLOY_SSH_KEY: ${{ secrets.ACEFIRE_DEPLOY_SSH_KEY }}
      ACEFIRE_DEPLOY_KNOWN_HOSTS: ${{ secrets.ACEFIRE_DEPLOY_KNOWN_HOSTS }}
      NICRRON_API_KEY: ${{ secrets.NICRRON_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      PRISMTRACE_API_KEY: ${{ secrets.PRISMTRACE_API_KEY }}
      PRISMTRACE_HOST: ${{ secrets.PRISMTRACE_HOST }}
      PRISMTRACE_PROJECT_ID: ${{ secrets.PRISMTRACE_PROJECT_ID }}
