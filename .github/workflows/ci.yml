name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Do not cancel a running main workflow while its deployment may be activating.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Set up Node for PDF export integration
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for PDF export integration
        run: npm --prefix frontend ci
      - name: Install document and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-impress fonts-liberation fonts-noto-cjk \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.lock
          python -m pip check
      - name: Test deployment boundaries and release archives
        run: python -m unittest discover -s deploy/home-vm/tests -p 'test_*.py'
      - name: Run offline backend tests
        run: bash scripts/ci/backend.sh
        env:
          PYTHON: python

  frontend:
    name: Frontend and release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build the frontend
        run: bash scripts/ci/frontend.sh
      - name: Package tested source and frontend
        run: python3 deploy/home-vm/package_release.py --output dist-release/ --commit "$GITHUB_SHA"
      - name: Retain the exact release for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-release-${{ github.sha }}
          path: |
            dist-release/release.tar.gz
            dist-release/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Publish home server
    needs: [backend, frontend]
    if: vars.HOME_CD_ENABLED == 'true' && github.repository == 'imnotmomo/acefire' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
